name: Update localization tool - TEST

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-localization-tool
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run automated tests
        run: npm test

      - name: Generate localization tool
        run: npm run generate -- --online --incremental

      - name: Verify generated interface
        run: |
          test -s review_interface.html
          echo "Interface generated successfully"

      - name: Test completed
        run: |
          echo "Tests completed."
          echo "No files were published."
