name: Update localization tool

on:
  schedule:
    - cron: "17 6 * * 2,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-localization-tool
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run checks
        run: npm test

      - name: Restore incremental baseline
        uses: actions/cache@v4
        with:
          path: data/baseline
          key: localization-baseline-${{ github.run_id }}
          restore-keys: |
            localization-baseline-

      - name: Generate localization tool
        run: npm run generate -- --online --incremental

      - name: Verify generated interface
        run: test -s review_interface.html

      - name: Prepare published interface
        run: |
          mkdir -p docs
          cp review_interface.html docs/index.html

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit generated interface
        run: |
          git add docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh localization tool data [skip ci]"
            git push origin HEAD:main
          fi

      - name: Publish to GitHub Pages
        run: |
          git fetch origin gh-pages
          git worktree add ../gh-pages-publish origin/gh-pages
          cp docs/index.html ../gh-pages-publish/index.html
          cd ../gh-pages-publish
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish refreshed localization tool [skip ci]"
            git push origin HEAD:gh-pages
          fi
